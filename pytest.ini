[pytest]
# Pytest configuration for MasterDatabase tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum version
minversion = 7.0

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=src/database
    --cov-report=term-missing
    --cov-report=html
    --cov-fail-under=80

# Markers for test organization
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow-running tests
    database: Database tests
    regression: End-to-end regression scenarios that spawn WIMI (tests/wimi_test/scenarios/)

# Coverage options live in .coveragerc, NOT here.
#
# coverage.py never reads pytest.ini -- only .coveragerc, pyproject.toml,
# setup.cfg and tox.ini. The [coverage:run] / [coverage:report] / [coverage:html]
# sections that used to sit below this line were silently inert for their whole
# life, which is how graph.py stayed in the measurement and held the total below
# --cov-fail-under=80 (#96). Do not re-add them here; edit .coveragerc.
