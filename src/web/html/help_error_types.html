# Error types: naming the mistake

## In short

An error type is a label you put on an entry saying what kind of mistake it was, and it is the unit every mistake-type screen in WIMI counts. WIMI ships sixteen in five groups, each with a written definition you can read as a tooltip and edit. They are optional, you can pick more than one, and the whole value of them is that you apply them the same way every week — so the fifteen minutes it takes to read the list once is the best-paid fifteen minutes in this manual.

## Why this chapter is longer than it looks like it should be

Everything the analytics can tell you about *what kind* of mistake you keep
making comes from this one field. Not from your sentences — nothing reads those
— from the labels. So the quality of every mistake-type number you will ever
read is exactly the quality of your tagging, and there are only two ways to ruin
it:

- picking whatever is nearest the top of the list when you are tired, which makes the counts a record of your fatigue;
- picking *Careless Mistake* in March for the thing you called *Misread Question* in January, which makes a trend out of a change in your own vocabulary.

Neither of those produces an error. Both produce a confident bar chart that is
wrong, and nothing in WIMI can detect either. That is the whole argument for
reading the definitions once and then being boring about them.

## The field

**Tags**, on the entry form, between the subject rows and the writing. Click into
it and the full palette opens underneath — every group, colour-coded, with its
types as buttons you toggle on and off. Or type two or more characters to search.
The placeholder is *"Search why you got this wrong..."*

Every group and every type carries its definition as a hover tooltip, in the
palette, in the search results, on the chip once you have picked it, and in the
Manage Error Types modal. Those definitions follow the type everywhere it is
shown later, including the analytics legends. If you are ever unsure what one
means, hover it; the answer is the same one printed below.

**Error types are optional.** An entry with none of them saves normally and
counts normally. [Why WIMI asks for a reason](help_the_premise.html) explains
why that is deliberate: a tag you clicked past records almost nothing, and an
untagged entry with a clear written reason is worth more than a tagged one
without. Tag when you know which kind of mistake it was. Do not guess to fill
the field.

When you do want to go back and tag, two places find the entries still without
a type. The analytics dashboard's difficulty and time card has **No error type**
at the top of its error-type list, and it shows where those mistakes fall by
difficulty and time; click a quadrant and the entry browser opens on them. The
entry browser's **Tags** filter has the same **No error type** option on its own.

**You can pick several, and there is no maximum.** Often two are honestly true
at once, and recording both is better than choosing arbitrarily. See *How many
to pick* below.

## The sixteen WIMI ships

These are the definitions as the app states them, word for word. The five groups
exist to make the list scannable, and the group's colour is what you see on the
chip.

**Knowledge Issues** (red) — *Mistakes caused by gaps or errors in what you
know.*

- **Knowledge Gap** — You never learned or covered this material.
- **Memory Failure** — You studied this before but couldn't recall it when it mattered.
- **Misunderstanding** — You learned the material but understood it incorrectly.

**Reading & Interpretation** (amber) — *Mistakes from misreading or
misinterpreting what the question asked.*

- **Misread Question** — You misread or overlooked key wording in the question.

**Execution Errors** (green) — *Mistakes made while working the problem, even
though you knew the material.*

- **Calculation Error** — You set up the problem correctly but made an arithmetic slip.
- **Careless Mistake** — You knew the answer but slipped through haste or inattention.
- **Incomplete Solution** — You started down the right path but didn't carry the work to completion.
- **Wrong Approach** — You chose a method or strategy that couldn't solve this problem.

**Test Strategy** (blue) — *Mistakes in how you played the test itself — timing,
guessing, and answer changes.*

- **Time Pressure** — Running low on time forced you to rush or abandon the question.
- **Second-Guessing** — You changed a correct answer to a wrong one.
- **Elimination Error** — You ruled out the correct answer while narrowing the choices.
- **Poor Prioritization** — You spent your time on the wrong questions or in the wrong order.
- **Wrong Guess Strategy** — You had to guess, and your guessing approach didn't pay off.

**Mental & Physical State** (purple) — *Mistakes influenced by how you felt —
stress, focus, or energy.*

- **Anxiety Related** — Nervousness or stress interfered with your thinking on this question.
- **Focus Problem** — You lost concentration or got distracted while answering.
- **Fatigue Related** — Tiredness or low energy dulled your performance on this question.

## The one question that sorts most entries

Before reaching for a specific type, answer this: **if you had been given
unlimited time, perfect calm and a second attempt, would you have got it right?**

- **No, I still would not have known it.** You are in *Knowledge Issues*.
- **Yes, because I would have read it properly.** *Reading & Interpretation*.
- **Yes, because I would not have fumbled the work.** *Execution Errors*.
- **Yes, but I did not have the time, or I talked myself out of it.** *Test Strategy*.
- **Yes, on a different day.** *Mental & Physical State*.

That question gets you to the right group far more reliably than scanning
sixteen names, and the group is most of the information. Picking the wrong member
of the right group costs you a little resolution; picking the wrong group makes
the whole breakdown misleading.

## Telling the hard ones apart

The pairs below are the ones that actually get confused. Each test is derived
from the definitions above, not from somewhere else.

**Knowledge Gap versus Memory Failure versus Misunderstanding.** All three are
"I did not know it", and the difference is what was in your head:

- *Knowledge Gap* — **nothing was there.** You had never covered this. The fix is to learn it for the first time.
- *Memory Failure* — **it was there and you could not reach it.** You recognise it the instant you read the explanation and are annoyed with yourself. The fix is review scheduling, not study.
- *Misunderstanding* — **something was there and it was wrong.** You had a confident belief and the belief was false. This is the most valuable of the three to record, because the other two are fixed by more exposure and this one is not: more exposure to a concept you have inverted just entrenches it.

The test for the third one: did you feel *certain* while answering? Confident and
wrong is *Misunderstanding*. Blank is *Knowledge Gap*. Vaguely familiar is
*Memory Failure*.

**Misread Question versus Careless Mistake.** Both are "I knew this". The
difference is where the slip was:

- *Misread Question* is about **the question's words.** You read "decreased" as "increased", missed a "not", missed the word "initial" or "most likely", answered the question you expected instead of the one printed.
- *Careless Mistake* is about **your own execution** after reading correctly. You knew the answer, you meant to select C, and you selected B.

If re-reading the stem is what would have saved you, it is *Misread Question*. If
re-reading your own answer is what would have saved you, it is *Careless
Mistake*.

**Wrong Approach versus Incomplete Solution versus Calculation Error.** These are
three stages of working a problem, and the stage is the label:

- *Wrong Approach* — the method was never going to work. You went wrong at step zero.
- *Incomplete Solution* — the method was right and you stopped partway. The work you did was correct as far as it went.
- *Calculation Error* — the method was right and complete and the arithmetic was wrong.

So: **wrong plan, right plan not finished, right plan finished badly.** If you
cannot tell *Wrong Approach* from *Misunderstanding*, ask whether what was wrong
was a fact or a procedure. A false belief about the content is
*Misunderstanding*; a sound belief applied through the wrong procedure is *Wrong
Approach*.

**Second-Guessing versus Elimination Error.** Both involve rejecting the right
answer, at different moments:

- *Second-Guessing* requires that you **had chosen it.** You wrote C and then changed it. If you never selected the right answer, this is not the one.
- *Elimination Error* is during the narrowing: you crossed the right answer off while working through the options, and never chose it.

*Second-Guessing* is worth being strict about, because it is the only error type
on the list whose fix is a rule rather than knowledge: if you record it five
times, your rule for the exam is "do not change answers". That instruction is
only trustworthy if the five are real.

**Time Pressure versus Poor Prioritization.** Both are about the clock:

- *Time Pressure* — **this question** ran you out of time. You rushed it or abandoned it.
- *Poor Prioritization* — **the other questions** ran you out of time. You spent eight minutes on a question you were never going to get and arrived here with ninety seconds.

The first is about the question in front of you; the second is about the ones
before it. If you can name the question that ate your time, use *Poor
Prioritization* on this one.

**Anxiety Related versus Focus Problem versus Fatigue Related.** The definitions
distinguish them cleanly — stress, distraction, tiredness — so the thing to be
careful about is not confusing them with each other but reaching for them too
readily. A mistake you made while tired is only *Fatigue Related* if being tired
is what caused it; a knowledge gap you met at hour four of a block is still a
knowledge gap. The question to ask is whether a rested, calm, undistracted
version of you, with the same knowledge, would have got it right.

## Where these types fall short

Two honest gaps, so that you can decide how to handle them rather than
discovering them at entry fifty.

**Careless Mistake is the catch-all, and nothing says so.** Its definition — "You
knew the answer but slipped through haste or inattention" — overlaps *Misread
Question* and *Calculation Error* by design. Decide now which way you will lean
and then stay consistent. The recommendation here: use the *specific* type
whenever one fits, and keep *Careless Mistake* for slips that are neither a
reading error nor an arithmetic one.

**Wrong Guess Strategy is hard to use as written.** "You had to guess, and your
guessing approach didn't pay off" is true of every wrong guess, so taken
literally the type records luck rather than strategy. The reading that makes it
useful: use it when your guessing *rule* was at fault — you always pick the
longest option, you always pick C, you guessed among options you should have been
able to eliminate — and not when you guessed sensibly from genuine ignorance.
That second case is *Knowledge Gap*, with *Time Pressure* beside it if the clock
forced the guess. If that distinction is not the one you want, this is a
definition worth rewriting in your own words; see below.

## How many to pick

More than one is normal and often more accurate. Two shapes recur:

- **A cause and a condition.** *Knowledge Gap* plus *Time Pressure*: you did not know it, and you had no time to reason it out. Both are true and both are actionable, differently.
- **A content error and a process error.** *Misunderstanding* plus *Elimination Error*: the false belief is why you crossed the right answer off.

What to avoid is tagging four types because all four are arguably present. Every
type you add is counted, so a habit of tagging generously inflates everything
evenly and tells you nothing. A useful discipline: **tag what you would want to
read back.** If a type would not change what you do next week, leave it off.

## Adding your own

The sixteen are a starting set, not a fixed vocabulary, and the ones you invent
for yourself are usually the ones you will actually act on.

Type a name that does not exist into the Tags field, and a **Create "your
name"** block appears under the search results with:

- a radio button for each of the five groups, with the first one pre-selected — so you choose where it lives, and you cannot make one that belongs to no group;
- a field for the definition, placeholder *"Definition (optional) — shown as a tooltip"*;
- a **Create Tag** button.

Press it and the new type is created and applied to the entry you are on
immediately. It is offered on **this exam only**: your other exams do not see it
until you add it to them (see *Your error types are shared across your exams*
below). If a type of that name already exists in that group because you made it
on another exam, WIMI offers that one here rather than making a second copy.

**Write the definition.** It is optional and it is the whole point. A type called
*Buzzword Trap* means something precise to you this week and nothing at all in
four months, and the definition is how future-you tags consistently with
present-you. One sentence saying what has to be true for this type to apply is
enough. Writing it is also the cheapest test of whether the type is worth
having: if you cannot state the condition in a sentence, the type will not be
applied consistently.

Good candidates for one of your own are the mistakes specific to your exam's
question style — the kind of distractor you keep falling for, the one
calculation you keep setting up backwards. Keep the list short. Thirty error
types is a list nobody reads to the bottom of, and a type you use twice a year
contributes nothing a written reason does not.

## Editing a definition

**⚙️ Manage error types**, at the bottom of the open palette, opens a modal
headed **Manage Error Types**. It lists the error types this exam offers, and
its sub-line says that a definition you edit there changes on every exam that
offers the type.

Every type gets a text box holding its current definition. Change it and a
**Save** button appears beside that one box; it stays hidden while the text
matches what is stored, so nothing can be saved by accident. Clearing the box
and saving removes the definition, and the type then has no tooltip at all rather
than an empty one.

**The sixteen WIMI ships are ordinary types with nothing special about them.** You
can rewrite every definition, and doing so is encouraged where WIMI's wording
does not match how you think. If *Wrong Guess Strategy* is going to mean
something specific in your hands, write that down in the box; the sentence you
write is the one you will see when hovering it at entry two hundred.

Each row also shows how many of this exam's entries currently carry that type,
so the modal doubles as an answer to "am I actually using this one".

**A definition is shared.** One type is one type in every exam that offers it, so
rewriting *Memory Failure* while you are on your Step 1 exam rewrites it on your
Shelf exam too. If an exam really needs a different meaning, that is a different
type with a different name.

## Removing one from an exam, or deleting it for good

Every row in the modal has **Remove from this exam**, and some also have a
trash button. They do very different things.

**Remove from this exam** is the everyday one. The exam stops offering the type,
so it leaves this exam's palette, its search results and the entry browser's
Tags filter for this exam. Nothing else changes:

- entries that already carry it **keep it**, chip and all, and the analytics still count them;
- every other exam that offers it still does;
- the type stays in your list, so you can bring it back from **Add from your other exams** at the bottom of the modal.

The confirmation says how many of this exam's entries carry it and keep it.
Removing a **group** removes the types listed under it on this exam as well.
If you remove everything, the exam offers nothing, and it stays that way: the
sixteen defaults are offered once, to a new exam, and are not put back. Bring
back what you want from **Add from your other exams**.

**Delete for good** is the trash button, and it only appears once **no other
exam offers the type**. While another exam does, the row says *"Also on N other
exams"* instead, and the way to delete it is to remove it from those exams
first. That makes deleting a type a deliberate two-step job; it does **not**
protect the other exams' entries. Deleting a type takes it off every entry that
carries it, in every exam — including the entries on an exam you removed it
from a minute ago, which kept it when you did.

So if you remove *Buzzword Trap* from your Shelf exam, where twelve entries
carry it, and then delete it for good from your Step 1 exam, those twelve Shelf
entries lose it too. Removing it from Shelf lost nothing; the delete is what
takes it off them.

Its confirmation, headed **Delete for good?**, gives the count across every
exam, and that count is the number to read: it includes the entries on every
exam, not just this one.

- with entries using it: *"This removes it from N entries in every exam, and from analytics. This cannot be undone."*
- with none: *"No entry in any exam carries it. This cannot be undone."*

Read that first line literally. **Deleting a type does not delete your entries —
it untags them.** The entries survive intact, including their written reasons;
they simply no longer carry that label, so they vanish from every mistake-type
count that used to include them. There is no undo and no archive: unlike
subjects and dimensions, which are archived and can be restored, an error type is
deleted outright.

So the one case to be careful about is deleting a type you have used a lot
because you have thought of a better name for it. See the next section. When in
doubt, use **Remove from this exam** and stop there: removing loses nothing,
and it is only a later delete for good that untags the entries.

A **group** can only be deleted for good when it holds no types at all, and its
trash button is greyed until then.

## Two things you cannot do

Worth knowing so you do not go looking for them, and worth knowing *before* you
create a type rather than after.

- **You cannot rename an error type.** There is no rename anywhere. The only route is to delete it and create a new one — which untags every entry that used the old name, and those entries do not come back tagged. So: **pick the name you can live with the first time.** Definitions can be rewritten freely; names cannot.
- **You cannot create a new group**, and you cannot move a type from one group to another. The five groups are fixed, so a type you create lives in whichever of them you pick at creation time, permanently. If none of the five fits well, pick the least wrong one — the type's own definition is doing the real work, and the group is organisation.

## Your error types are shared across your exams

<!-- tour
page: exam-wizard
anchor: wizard-review
text: Your error types are shared across your exams. A new exam offers the
  sixteen defaults the first time you open its entry form, and a type you
  create on one exam stays on that exam until you add it to another. A
  definition is shared, so rewriting it changes it everywhere.
-->

Your profile holds **one set of error types**, and each exam has a list of the
ones it offers. A new exam offers the sixteen defaults, the first time you open
its entry form rather than when you create it.

- **A type you create on one exam is offered on that exam only.** Your other exams can have types this one does not, and the reverse. To offer it on another exam too, open **Manage Error Types** there and use **Add from your other exams**, which lists every type you have that this exam does not offer yet.
- **A definition is shared.** Rewriting *Memory Failure* on your Step 1 exam changes it on your Shelf exam too, because it is the same type. That is also why the analytics count one *Memory Failure*, not one per exam.
- **Remove from this exam** takes a type out of one exam's list and leaves its entries tagged. **Delete for good** appears only when no other exam offers the type, and it untags every entry carrying the type in every exam, including exams you removed it from. See *Removing one from an exam, or deleting it for good* above.
- **Deleting an exam permanently never deletes an error type.** It takes that exam's list with it; every type, and every other exam's entries carrying it, stay as they were.

## Using it well

- **Read the definitions once, properly, before you have fifty entries.** They are the shared vocabulary between you now and you in three months, and nothing else in WIMI reconciles the two.
- **Use the five-group question** — "with unlimited time, calm, and a second attempt, would I have got it right?" — rather than scanning sixteen names.
- **Be consistent before being precise.** A slightly wrong label applied the same way every time still produces a true trend. A perfect label applied differently each month does not.
- **Write a definition for every type you create**, even a one-liner, and rewrite WIMI's where its wording is not yours.
- **Leave the field empty when you do not know.** An honest blank is better than a guess that will be counted.
- **Reread your own definitions every few weeks.** The commonest failure here is drift you cannot see, and the modal is where you catch it.
