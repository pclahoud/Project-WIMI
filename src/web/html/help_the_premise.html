# Why WIMI asks for a reason

## In short

WIMI exists to record why you missed a question, in your own words, while you can still remember. Everything else in the app is built on those sentences, which is why the error-type tags on the entry form are optional and the two written answers are not.

## A score tells you how many, not which

Reviewing a practice test usually ends at a number. Forty questions, twelve
wrong, 70%. You read the explanations, nod at the ones you half knew, and move
on. A week later you take another block and miss twelve more, and nothing you
have written down can tell you whether they were the same twelve kinds of
mistake.

That is the gap WIMI is built around. The count is not the finding. *Which*
mistake, and *why*, is the finding, and it is only available to you in the few
minutes after you see the answer. By the next morning you remember that you got
a renal question wrong. You no longer remember that you knew the mechanism
perfectly and read "decreased" as "increased".

## The two questions WIMI will not let you skip

The entry form asks for a lot and requires very little. To save an entry you
must fill in five things: your answer, the correct answer, at least one primary
subject, and both of these:

- **Why did you get this wrong?** What happened in your head. The mechanism of
  the miss.
- **Why is the correct answer correct?** The content, in your own words, as if
  you were explaining it to someone who asked.

Everything else on the page is optional. The question reference, the difficulty
rating, the time spent, the secondary subjects, the notes, the images, and
the error-type tags.

## Write the mechanism, not the content

<!-- tour
page: entry-form
anchor: entry-form-reflection-editor
text: This field wants the mechanism of the miss, not the content you should
  have known. "I knew this and read the stem too fast" belongs here; the
  physiology belongs in the field below it.
-->

The commonest way to waste the first field is to write what you should have
known. "Renal tubular acidosis type 2 affects the proximal tubule" belongs in
the second field. The first field wants the sentence you would be embarrassed to
say out loud:

- "I knew this. I read the stem too fast and answered the opposite."
- "I had never seen this drug."
- "I got it down to two and talked myself out of the right one."
- "I knew the mechanism and could not remember which direction the lab moves."
- "Ninety seconds left and I guessed."

Those five are different problems with different fixes, and only one of them is
solved by reading the topic again. That is the whole return on the thirty
seconds it takes to write one.

## Why the tags are optional and the sentence is not

<!-- tour
page: entry-form
anchor: entry-form-tags-search-input
text: Error types are optional on purpose: a tag you clicked past records
  almost nothing, so an untagged entry with a clear written reason is worth
  more than a tagged one without. Tag when you already know which kind of
  mistake this was.
-->

WIMI ships sixteen error types in five groups, and a new profile gets them
seeded automatically. They exist so the app can count: a tag is a thing a
dashboard can total, a sentence is not.

But a tag is also a thing you can click past. Picking *Misread Question* from a
list takes under a second and records almost nothing, and if that were the only
field you filled in, then three months later you would have a bar chart and no
memory. The sentence is what you will actually recognise when you read it back,
and the tag is the index over it. So the required field is the one that cannot
be clicked, and tagging is something you do when you already know which kind of
mistake this was.

The practical consequence: if you are not sure which tag fits, write the
sentence and leave the tags alone. An untagged entry with a clear reason is
worth more than a tagged one without.

## What WIMI does with what you write

Almost nothing, and that is deliberate. Your two paragraphs are stored as you
typed them and shown back to you as you typed them. No part of the analytics
scores your prose, grades it, or tries to decide what you meant.

What the analytics count is structure: which subjects your entries sit on, which
error types you tagged, how often, and how heavily each subject counts on your
exam. The sentences are for you, when you open the entry again and when you
read a subject's page and see five of your own reasons in a row.

One feature does read a field, and only when you ask it to. On the entry form,
*Related topics* can offer to link two subjects your explanation mentions
together. It reads the second field, the one about the correct answer, it runs
only when you press the button, and every suggestion it makes is invisible until
you confirm it.

## If you do only one thing

Write the first field as a sentence about yourself rather than about the topic.
Tags, difficulty ratings, time spent and notes are all worth having, and none of
them will tell you anything that sentence does not.
