# Planning sessions on the calendar

## In short

The calendar shows every study session you have logged and every session you have planned, on one week or month grid, one colour per exam. You plan a session by picking a day and saying what you intend to do; when the day comes you start it from the calendar or from the dashboard, and the plan becomes an ordinary session with nothing to re-enter. A plan you miss stays on the calendar as overdue until you start it or mark it skipped. Nothing on the calendar changes your analytics: a plan counts for nothing until it is a real session with entries in it.

## Getting there

The dashboard has a **Calendar** link beside *Create New Exam*, and a session's setup page has one in its header. The calendar opens on the week containing today, or the month if you changed the default in **Settings → Calendar**. Weeks start on Monday, the same week your weekly goal counts.

## Reading the grid

Each day is a cell. A solid chip is a session you logged, labelled with its exam; a dashed chip marked *Planned* is a session you intend to have. An exam's scheduled date appears as a marker on its day. The legend under the grid maps each colour to an exam: an exam you gave a colour to in its wizard uses that colour, and any other exam gets one of four from your theme. Plans with no exam are grey.

Pick a day, with a click or with the arrow keys and Enter, and the panel beneath the grid lists everything on it with its actions: open a logged session, or edit, start, skip or remove a planned one.

<!-- tour

text: Plan a session for a day you choose. The exam, the question bank, a

## Planning a session

**Plan a session** opens a dialog. Only the date is required. You can name the exam and question bank, a start time, a duration, how many questions you intend to do, a title and notes.

- **Repeat weekly** turns the plan into a series: tick the weekdays, and either an end date or a number of sessions, or neither for an open-ended series. The calendar draws every occurrence; the series is stored once.
- **Also save these settings as a template** keeps the exam, bank, time, duration and question count under a name, so the next plan can start from it with the **Start from a template** picker at the top of the dialog. Templates are listed, and archived, in **Settings → Calendar**.
- A plan can have no exam. You will be asked for one when you start it, because a logged session always belongs to an exam.

## Starting a planned session

On the day, **Start** on the plan (or **Start session** on the dashboard's reminder) opens the session setup page with the plan's exam, bank, date, duration and question count filled in. Starting creates the session the ordinary way and links the plan to it, so the calendar shows one chip for that day, not two. A plan dated in the past is recorded under its planned day unless you change the date in the form; the streak and the heatmap read that date.

Editing a single occurrence of a series, or starting or skipping one, affects that date only; the rest of the series is untouched. Removing a series removes all of its unstarted occurrences. Removing a plan never removes a session it already became.

## When a day passes

A plan whose day passes with no session stays on the calendar as **overdue**, and the dashboard reminds you about it the next time you open WIMI, once per launch, until you start it or mark it skipped. WIMI never marks a plan skipped for you. There are no desktop notifications in this version: WIMI can only remind you while it is open.

## Exporting to another calendar

**Export (.ics)** writes a standard calendar file you can import into Google Calendar, Outlook or Apple Calendar. It carries your planned sessions, as repeating events where you planned a series, and your logged sessions as all-day events. A plan with a start time is exported as an exact moment in time, in the zone your computer was in when you exported; a plan without one is an all-day event. The file contains your plans and exam names and nothing else.

## What the calendar does not do

- It does not count. A planned session is not a session: it appears nowhere in your analytics, your streak or your goals until you start it and log entries.
- It does not fill in your sessions for you. Starting a plan takes you to the same setup page a new session uses; the plan only saves the typing.
- It does not notify you while WIMI is closed.
