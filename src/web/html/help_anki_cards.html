# Your Anki cards beside the mistake

## In short

If you keep flashcards in Anki, WIMI can show the cards for the question you got wrong on that question's entry page, with how each card is doing. It reads Anki on this computer through the AnkiConnect add-on, never over the internet. You can suspend or unsuspend a card from the entry, and put one of a card's images into the entry's attachments. What WIMI fetched stays readable when Anki is closed, and a fetch that finds Anki closed changes nothing. When a question matches several cards, WIMI also points out the ones that look like the mistake, and you decide which to show first.

## Setting it up

Everything starts in **Settings → Anki Integration** (the Settings chapter describes each control):

- Install the **AnkiConnect** add-on in Anki, and keep Anki open while you use this.
- Tick **Use Anki on this computer**. **Test connection** tells you whether Anki answered.
- Add a **search template** for each question bank whose questions have cards. It is an ordinary Anki search with `{{qid}}` where the question id goes, for example `tag:MyDeck::{{qid}}`.

The switch and the port stay on this computer. Your templates, and the cards WIMI has already fetched, travel with your profile.

## What the entry shows

The **Anki cards** section appears on an entry's page, right after the explanation, only on a computer where Anki is switched on. It needs two things from the entry, and says which is missing if either is: a **question id**, and a **question bank** on the entry's session that has a template.

When you open an entry, WIMI draws the cards it already has straight away. If it has never fetched them, or they are older than the refresh time in Settings (an hour unless you change it), it asks Anki for newer ones while you read. **Refresh from Anki** asks again whenever you like. The line under the heading says how many cards there are and when they were last fetched.

Each card is one row, closed to start with. The row's title is the card's own text, and under it is one line with the deck, the interval, reviews and lapses, and the estimated recall. Press the title to open the card, and again to close it. An open card shows:

- The card's back, in full. The front is already the title.
- **More fields**: the names of the card's other fields, such as First Aid or Sketchy. Press a name to show that field. A field whose name ends in "id", like `ankihub_id`, is never shown, because it is an identifier rather than something to read. Which fields appear at all is still chosen per note type in Settings.
- **Interval**, **Reviews** and **Lapses**, as Anki records them, and **Ease**, which is Anki's own ease factor for the card.
- **Next review (estimated)**, **Stability (estimated)** and **Recall now (estimated)**. WIMI works these out from the card's review history using the FSRS-4.5 formulas. They are WIMI's arithmetic, not Anki's numbers, and they can differ from what Anki shows, especially if your collection does not use FSRS.
- **Show first** and **Suspend in Anki**, both explained below.

If you chose **one row per note** in Settings, the cards of one note share a row. Interval and the estimates belong to a single card, so that row shows how many cards the note has and their reviews and lapses instead.

## When Anki is closed

Nothing is lost. The cards WIMI fetched before stay on the page. The status line says Anki is not answering and when the cards on screen were fetched. Open Anki and press **Refresh from Anki**.

## Cards that look like this mistake

When a question matches two or more cards, WIMI points out the ones whose text
names what this entry is about: one of the entry's subjects, another name you
recorded for one of them, or the correct answer when it is words rather than a
letter. Each proposal sits on the card it is about and shows the words that matched.
WIMI matches whole words exactly as written, ignoring capitals; it does not
guess at near spellings, so if your cards spell a subject differently, give
the subject that spelling as another name.

Proposals are only worth answering when they pick some cards out of the rest.
So WIMI offers the answers only when **at most half** of the cards are
proposed. If more match than that, as when every card in an appendicitis deck
mentions appendicitis, it says so in one sentence instead, for example *"9 of
11 cards mention appendicitis, so WIMI can't tell which one this mistake is
about"*. You can still open any card and press **Show first**.

When it does offer them, each proposal has three answers, and none of them is
the expected one:

- **Show first** moves the card to the top of this entry's list and marks it *Shown first for this entry*. **Stop showing first**, in the open card, undoes it.
- **Not for this entry** stops proposing the card here.
- **Never for** a subject stops proposing the card because of that subject, on any entry. It is not offered when only the correct answer matched, because there is no subject to apply it to.

None of the three hides a card, and none changes anything in Anki. They only
decide what WIMI points out and in what order.

## Suspending a card

**Suspend in Anki** and **Unsuspend in Anki**, in the open card, change the card in Anki itself, the same as doing it in Anki's browser. Only this entry's cards can be changed from here. In the one-row-per-note view the button acts on all of that note's cards.

## A card's images

A field that holds pictures shows them as small thumbnails when the field is
open: six at first, with a button to show more. WIMI fetches a picture from
Anki only when its field is open, so a closed card costs nothing.

- **Pressing a thumbnail** opens the picture in the entry's image viewer, without saving anything. The left and right arrow keys, or the arrows on screen, move through every picture on that card in field order, and go round again at the ends. The caption names the field and the picture's place, such as *Sketchy, image 3 of 26*, because a picture's file name is usually a meaningless string.
- **Save to Attachments**, in the viewer, copies the picture into the entry's attachments, where it stays even if the card changes or Anki is closed. Once it is there the button reads **In Attachments**, so the same picture is not attached twice.
